@switch (daneService.search_prompt()) {
  @case('trumna')  @case('znicz')  @case('urna')  @case('kwiaty')  @case('nagrobek'){
    <product-list />
  }
  @case ('formulaz'){
    <form-selector />
  }
  @case ('sale-list'){
    <sale-list />
  }
  @case ('product'){
    <product-viewer />
  }
  @case ('cart'){
    <cart />
  }
  @case ('wish'){
    <wish-list />
  }
  @default {
    <sales-banner />
  }
}
