<main>
  <img id="logo" src="/images/images.jpeg">
  <nav>
    <div id="upper">
      <a><button class="categoryChangeButtons">Promocje</button></a>
      <a><button class="categoryChangeButtons">Produkty</button></a>
      <a><button class="categoryChangeButtons">Usługi</button></a>
    </div>
    <div id="bottom">
      <p>Znicze</p>
      <p>Trumny</p>
      <p>Urny</p>
      <p>Kwiaty</p>
      <p>Nagrobki</p>

      <p>Pogrzeb</p>
      <p>Balsamacja</p>
      <p>Kremacja</p>
      <p>Promesa</p>
      <p>Konfigurator Pogrzebów</p>
    </div>
  </nav>
  <form>
    <input name="Wyszukiwanie" type="text" placeholder=" Wyszukaj produkt">
    <button type="submit"><img src="/images/images.jpeg"></button>
  </form>
  <button id="buildButton">Złóż swój własny pogrzeb!</button>
  <div id="usefullButtons">
    <button id="cartButton"><img src="/images/images.jpeg"></button>
    <button id="wishList"><img src="/images/images.jpeg"></button>
  </div>
</main>

@for (item of items; track item.id) {
  <tr>
    <td>{{ item.id }}</td>
    <td>{{ item.name }}</td>
  </tr>
}
