<main>
  <img id="logo" src="/images/images.jpeg">
  <nav>
    <div id="upper">
      <a><button class="categoryChangeButtons" [class.active]="CategoryView == 1" (click)="categoryView(1)">Promocje</button></a>
      <a><button class="categoryChangeButtons" [class.active]="CategoryView == 2" (click)="categoryView(2)">Produkty</button></a>
      <a><button class="categoryChangeButtons" [class.active]="CategoryView == 3" (click)="categoryView(3)">Usługi</button></a>
    </div>
    <div id="bottom">
      @if (CategoryView == 1){
        @for (sale of supabaseService.sales(); track sale.id) {
            <p>{{sale.name}}</p>
        }
      }
      @if (CategoryView == 2){
        <p (click)="search('znicz')">Znicze</p>
        <p (click)="search('trumna')">Trumny</p>
        <p (click)="search('urna')">Urny</p>
        <p (click)="search('kwiaty')">Kwiaty</p>
        <p (click)="search('nagrobek')">Nagrobki</p>
      }
      @if (CategoryView == 3){
        <p>Pogrzeb</p>
        <p>Balsamacja</p>
        <p>Kremacja</p>
        <p>Promesa</p>
        <p>Konfigurator Pogrzebów</p>
      }
    </div>
  </nav>
  <form>
    <input class="OtherChangeButtons" [class.active]="OtherView == 1" (click)="otherChange(1)" name="Wyszukiwanie" type="text" placeholder=" Wyszukaj produkt">
    <button type="submit"><img src="/images/images.jpeg"></button>
  </form>
  <button class="OtherChangeButtons" [class.active]="OtherView == 2" (click)="otherChange(2)" id="buildButton">Złóż swój własny pogrzeb!</button>
  <div id="usefullButtons">
    <button id="cartButton"><img src="/images/images.jpeg"></button>
    <button id="wishList"><img src="/images/images.jpeg"></button>
  </div>
</main>
