<div>
  <form (ngSubmit)="send_request()">
    <h2>Dodawanie nowego produkty</h2>

    <label for="name">name </label>
    <input name="name" type="text" [(ngModel)]="name"><br><hr>

    <label for="desc">description </label>
    <input name="desc" type="text" [(ngModel)]="desc"><br><hr>

    <label for="type">type </label>
    <select name="type" [(ngModel)]="type">
      @for (siur of type_enum; track siur) {
        <option (value)="siur">{{ siur }}</option>
      }
    </select><br><hr>

    <label for="price">price </label>
    <input name="price" type="number" [(ngModel)]="price"><br><hr>

    <label for="in_stock">in stock </label>
    <input name="in_stock" type="number" [(ngModel)]="in_stock"><br><hr>

    <label for="sale">sale </label>
    <select name="sale" [(ngModel)]="sale">
      @for (sale of sales(); track sale.id) {
        <option (value)="sale.id">{{ sale.name }}</option>
      }
    </select><br><hr>

    <label for="props">properties </label>
    <select name="props" multiple size="10px" [(ngModel)]="props">
    @for (siur of prop_enum; track siur) {
      <option (value)="siur">{{ siur }}</option>
    }
    </select><br><hr>

    <label for="image">image path </label>
    <input name="image" type="text" [(ngModel)]="image"><br><hr>

    <input type="submit" value="submit">

    <h2 id="err">{{ err_msg() }}</h2>
  </form>

</div>
