<div>
  @for (sale of supabaseService.sales(); track sale.id) {
    @if (sale.id == active_sale_id) {
      <img id="img" [src]="image_src()">
      }
  }

  <div id="nav">
    <nav>
      <button id="left_edge" (click)="prev_sale()"><</button>

      @for (sale of supabaseService.sales(); track sale.id) {
          <button class="button" [class.active]="sale.id == active_sale_id" (click)="change_sale(sale.id)">{{sale.name}}</button>
      }

      <button id="right_edge" (click)="next_sale()">></button>
    </nav>
  </div>
</div>
