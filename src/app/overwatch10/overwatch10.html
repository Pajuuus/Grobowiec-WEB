<form (ngSubmit)="send_request()">
  <h2 id="msg" [class.err]="msg_type == 0" [class.suc]="msg_type == 1">{{ msg() }}</h2>

  <h2>Removing sale</h2>

  <label for="select_prod">Select sale</label>
  <select name="select_prod" [(ngModel)]="selected_prod">
    @for (prod of supabaseService.sales(); track prod.id) {
      <option [value]="prod.id">{{ prod.name }}</option>
    }
  </select><hr><br>

  @if (selected_prod != -1) {
    <h3>Selected: {{ selected().name }}</h3><hr><br>

    <button type="submit">Delete</button>
  }

  <h2 id="msg" [class.err]="msg_type == 0" [class.suc]="msg_type == 1">{{ msg() }}</h2>
</form>
