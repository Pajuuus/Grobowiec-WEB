<div>
    <img id="img" [src]="selected().image_path">
    <div id="ddiv">
        <h1 id="p">{{ selected().name }}</h1>
    </div>

    <div id="div">
        @for (prod of selected().products; track prod) {
            <div id="div" (click)="clicked(prod)">
                <img class="img" [src]="product(prod).image">
                <p>{{ product(prod).name }}</p>
                <p><s>{{ product(prod).price }} zł</s><b> {{ (product(prod).price * selected().how_much).toFixed(2) }} zł</b></p>
            </div>
        }
    </div>
</div>
