<main [class.active]="daneService.asideBar()">
  <button (click)="Close(false)">X</button>

  <nav>
    @if(user.username() == ""){
      <h1>Logowanie</h1>
      <label>Telefon</label>
      <input type="number" #tel placeholder="100 200 300">
      <label>Hasło</label>
      <input type="password" #pas placeholder="Twoje hasełko"> <br>
      <button (click)="Login(tel.value, pas.value)">zaloguj</button> <br>
      <h3>Nie masz konta? Załóz już dziś i odkryj pełnię możliwości!</h3>
      <button (click)="RegisterView()">Zarejestruj</button>

      @if(register){
      <h1 id="h1">Tworzenie konta</h1>
      <label>Numer Telefonu</label>
      <input #phone type="number" placeholder="600 100 100">
      <label>Przydomek</label>
      <input #username type="text" placeholder="Teppichfresser">
      <label>Imię</label>
      <input #name type="text" placeholder="Włodzimież">
      <label>Nazwisko</label>
      <input #surname type="text" placeholder="Epstein">
      <label>Hasło</label>
      <input #password type="password" placeholder="1234"> <br>
      <button (click)="Register(phone.value, username.value, name.value, surname.value, password.value)">huj</button>
      }
    }

  @if(user.username() != ""){
    <h1>Ustawienia konta</h1>
    <p>W budowie, na razie możesz se coś kupić</p>
    <button (click)="unlogin()">Wyloguj</button>
    <button (click)="DeleteUser()">Usuń konto</button>
  }
</nav>
</main>
