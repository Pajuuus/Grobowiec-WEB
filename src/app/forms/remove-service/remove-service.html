<form (ngSubmit)="send_request()">
  <h2>Removing service</h2>

  <label for="select_ser">Select service</label>
  <select name="select_ser" [(ngModel)]="selected_ser">
    @for (ser of supabaseService.services(); track ser.id) {
      <option [value]="ser.id">{{ ser.name }}</option>
    }
  </select><hr><br>

  @if (selected_ser != -1) {
    <h3>Selected: {{ selected().name }}</h3><hr><br>

    <button type="submit">Delete</button>
  }
</form>
