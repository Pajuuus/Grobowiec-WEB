<div id="div">
  <div id="div2">
    <h2>Select database action</h2>

    <select [(ngModel)]="selected_page">
      <option value="add_product">Add product</option>
      <option value="delete_product">Delete product</option>
      <option value="add_sale">Add sale</option>
      <option value="delete_sale">Delete sale</option>
    </select><br>

    <div id="page">
      <add-prod [class.active]="selected_page == 'add_product'" />
      <remove-prod [class.active]="selected_page == 'delete_product'" />
      <add-sale [class.active]="selected_page == 'add_sale'" />
      <remove-sale [class.active]="selected_page == 'delete_sale'" />
    </div>
  </div>
</div>
