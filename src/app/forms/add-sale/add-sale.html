<div>
  <form (ngSubmit)="send_request()">
    <h2>Adding new sale</h2>

    <label for="name">name </label>
    <input name="name" type="text" [(ngModel)]="name"><hr><br>

    <label for="desc">description </label>
    <textarea name="desc" [(ngModel)]="desc"></textarea><hr><br>

    <label for="since">valid since </label>
    <input name="since" type="date" [(ngModel)]="since">

    <label for="until">valid until </label>
    <input name="until" type="date" [(ngModel)]="until">

    <label for="how_much">discount % </label>
    <input name="how_much" type="number" [(ngModel)]="how_much">

    <label for="image">image path </label>
    <input name="image" type="text" [(ngModel)]="image"><hr><br>

    <button type="submit">Add</button>
  </form>

</div>
