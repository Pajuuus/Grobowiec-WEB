<form (ngSubmit)="send_request()">
  <h2>Removing sale</h2>

  <label for="select_sale">Select sale</label>
  <select name="select_sale" [(ngModel)]="selected_sale">
    @for (sale of supabaseService.sales(); track sale.id) {
      <option [value]="sale.id">{{ sale.name }}</option>
    }
  </select><hr><br>

  @if (selected_sale != -1) {
    <h3>Selected: {{ selected().name }}</h3><hr><br>

    <button type="submit">Delete</button>
  }
</form>
